<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
    <title>No Dues Portal</title>
</head>

<body>
    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <main>
        <section sec:authorize="isAnonymous() or hasRole('ADMIN')">
            <h2>System summary</h2>
            <ul class="summary-grid">
                <li><strong th:text="${studentCount}">0</strong>Students</li>
                <li><strong th:text="${staffCount}">0</strong>Staff</li>
                <li><strong th:text="${facultyCount}">0</strong>Faculty</li>
                <li><strong th:text="${requestCount}">0</strong>Requests</li>
            </ul>
        </section>
    </main>
</body>

</html>
