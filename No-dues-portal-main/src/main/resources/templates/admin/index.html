<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/app.css"><title>Admin controls</title></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main>
<h1>Admin controls</h1>
<p class="notice" th:if="${param.error}">The Admin action could not be completed. Check the values and try again.</p>
<h2 id="users">Users</h2>
<input id="userSearch" type="search" placeholder="Search users by name or email">
<label class="page-size-label" for="userPageSize">Rows per page</label>
<select class="page-size-select" id="userPageSize">
    <option>5</option><option selected>10</option><option>25</option>
</select>
<div class="table-scroll">
<table id="usersTable" class="admin-users-table">
    <tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr>
    <tr th:each="user : ${users}" class="user-row">
        <td>
            <span th:text="${user.name}" th:if="${user.role == T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}"></span>
            <input name="name" th:value="${user.name}" aria-label="User name"
                   th:attr="form=${'update-' + user.id}"
                   th:if="${user.role != T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}" required>
        </td>
        <td>
            <span th:text="${user.email}" th:if="${user.role == T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}"></span>
            <input name="email" th:value="${user.email}" type="email" aria-label="User email"
                   th:attr="form=${'update-' + user.id}"
                   th:if="${user.role != T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}" required>
        </td>
        <td>
            <span th:text="${user.role}" th:if="${user.role == T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}"></span>
            <select name="role" th:if="${user.role != T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}"
                    th:attr="form=${'update-' + user.id}">
                <option value="STAFF" th:selected="${user.role.name() == 'STAFF'}">Staff</option>
                <option value="FACULTY" th:selected="${user.role.name() == 'FACULTY'}">Faculty</option>
                <option value="STUDENT" th:selected="${user.role.name() == 'STUDENT'}">Student</option>
            </select>
        </td>
        <td th:text="${user.active}"></td>
        <td>
            <form method="post" action="/admin/users/update" class="inline-form"
                  th:id="'update-' + ${user.id}"
                  th:if="${user.role != T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="userId" th:value="${user.id}">
                <button type="submit">Save</button>
            </form>
            <form method="post" action="/admin/users/remove" class="inline-form"
                  onsubmit="return confirm('Remove this user permanently? This action cannot be undone.');"
                  th:if="${user.role != T(edu.iitm.cse.nodues.domain.UserRole).ADMIN && user.active}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="userId" th:value="${user.id}">
                <button type="submit">Remove</button>
            </form>
            <span class="muted" th:if="${user.role == T(edu.iitm.cse.nodues.domain.UserRole).ADMIN}">Protected Admin</span>
        </td>
    </tr>
</table>
</div>
<p class="actions">
    <button type="button" id="previousUsers">Previous</button>
    <button type="button" id="nextUsers">Next</button>
</p>
<h3>Add user</h3>
<form method="post" action="/admin/users">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <p><label for="newName">Name</label><input id="newName" name="name" required></p>
    <p><label for="newEmail">Email</label><input id="newEmail" name="email" type="email" required></p>
    <p><label for="newRole">Role</label>
        <select id="newRole" name="role"><option value="FACULTY">Faculty</option><option value="STAFF">Staff</option></select></p>
    <p><label for="newPassword">Password (optional)</label><input id="newPassword" name="password" type="password" minlength="8"></p>
    <button type="submit">Add user</button>
</form>
<h2 id="settings">Notification reminder settings</h2>
<form method="post" action="/admin/threshold">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input name="threshold" type="number" min="1" th:value="${settings.unreadReminderThreshold}" required>
    <button type="submit">Save threshold</button>
</form>
<script>
const search = document.getElementById('userSearch');
const size = document.getElementById('userPageSize');
const rows = [...document.querySelectorAll('.user-row')];
let page = 0;
function renderUsers() {
    const query = search.value.toLowerCase();
    const filtered = rows.filter(row => row.textContent.toLowerCase().includes(query));
    const pageSize = Number(size.value);
    const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
    page = Math.min(page, pages - 1);
    rows.forEach(row => row.hidden = true);
    filtered.slice(page * pageSize, (page + 1) * pageSize)
        .forEach(row => row.hidden = false);
}
search.addEventListener('input', () => { page = 0; renderUsers(); });
size.addEventListener('change', () => { page = 0; renderUsers(); });
document.getElementById('previousUsers').addEventListener('click', () => {
    page = Math.max(0, page - 1); renderUsers();
});
document.getElementById('nextUsers').addEventListener('click', () => {
    page++; renderUsers();
});
renderUsers();
</script>
</main>
</body>
</html>
