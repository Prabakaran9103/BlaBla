<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/app.css"><title>Profile | No Dues Portal</title></head>
<body><div th:replace="~{fragments/navigation :: navigation}"></div><main>
<h1>My profile</h1>
<p class="notice" th:if="${param.updated}">Profile updated.</p>
<p class="notice" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/profile" enctype="multipart/form-data">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p><label for="name">Name</label><input id="name" name="name" th:value="${user.name}" required></p>
<p><label>Email</label><input th:value="${user.email}" readonly></p>
<h2>Change password</h2>
<p class="muted">Leave these fields empty if you do not want to change your password.</p>
<p><label for="oldPassword">Old password</label><input id="oldPassword" name="oldPassword" type="password"></p>
<p><label for="password">New password</label><input id="password" name="password" type="password" minlength="8"></p>
<p><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8"></p>
<p><label for="picture">Display picture</label><input id="picture" name="picture" type="file" accept="image/*"></p>
<button type="submit">Save profile</button>
</form></main></body></html>
