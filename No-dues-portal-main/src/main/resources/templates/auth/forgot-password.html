<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><link rel="stylesheet" href="/css/app.css"><title>Forgot password | No Dues Portal</title></head>
<body><div th:replace="~{fragments/navigation :: navigation}"></div><main><h1>Forgot password</h1>
<p class="notice" th:if="${message}" th:text="${message}"></p><p class="notice" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/forgot-password"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p><label for="email">Institute email</label><input id="email" name="email" type="email" required></p><button type="submit">Create reset link</button></form>
</main></body></html>
