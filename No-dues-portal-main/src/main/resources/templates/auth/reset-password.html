<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><link rel="stylesheet" href="/css/app.css"><title>Reset password | No Dues Portal</title></head>
<body><div th:replace="~{fragments/navigation :: navigation}"></div><main><h1>Reset password</h1>
<p class="notice" th:if="${error}" th:text="${error}"></p><form method="post" action="/reset-password">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}">
<p><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" required></p><button type="submit">Reset password</button>
</form></main></body></html>
