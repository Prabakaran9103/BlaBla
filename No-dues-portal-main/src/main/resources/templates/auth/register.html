<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
    <title>Register</title>
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main>
<h1>Register</h1>
<p class="notice">Registration is only for students with a @smail.iitm.ac.in email.</p>
<p class="notice" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/register" th:object="${authForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <p><label for="name">Name</label>
        <input id="name" th:field="*{name}" required>
        <span th:errors="*{name}"></span></p>
    <p><label for="email">Institute email</label>
        <input id="email" th:field="*{email}" type="email" required>
        <span th:errors="*{email}"></span></p>
    <p><label for="password">Password</label>
        <input id="password" th:field="*{password}" type="password" minlength="8" required>
        <span th:errors="*{password}"></span></p>
    <button type="submit">Register</button>
</form>
<p><a href="/login">Back to login</a></p>
</main>
</body>
</html>
