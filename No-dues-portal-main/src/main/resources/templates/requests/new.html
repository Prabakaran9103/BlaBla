<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
    <title>Create No Dues Request</title>
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main>
<h1>Create No Dues Request</h1>
<p><a class="button button-secondary" href="/">Home</a>
    <a class="button button-secondary" href="/requests">My requests</a></p>

<p class="notice" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/requests" enctype="multipart/form-data" th:object="${requestForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <p>
        <label for="facultySearch">Search Faculty advisor</label>
        <input id="facultySearch" type="search" placeholder="Type a name or email">
        <label for="facultyAdvisorId">Select Faculty advisor</label>
        <select id="facultyAdvisorId" th:field="*{facultyAdvisorId}" size="5">
            <option value="">Select a Faculty advisor</option>
            <option th:each="facultyMember : ${faculty}"
                    th:value="${facultyMember.id}"
                    th:text="${facultyMember.name + ' (' + facultyMember.email + ')'}"></option>
        </select>
        <span th:errors="*{facultyAdvisorId}"></span>
    </p>
    <p>
        <label for="details">Request details</label><br>
        <textarea id="details" th:field="*{details}" rows="8" cols="60"></textarea>
        <span th:errors="*{details}"></span>
    </p>
    <p>
        <label for="files">Supporting files (optional, maximum 3 files, 5 MB each)</label>
        <input id="files" name="files" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
    </p>
    <button type="submit">Submit request</button>
</form>
<script>
    const search = document.getElementById('facultySearch');
    const options = document.querySelectorAll('#facultyAdvisorId option');
    search.addEventListener('input', () => {
        const query = search.value.toLowerCase();
        options.forEach(option => {
            option.hidden = query && !option.textContent.toLowerCase().includes(query);
        });
    });
</script>
</main>
</body>
</html>
