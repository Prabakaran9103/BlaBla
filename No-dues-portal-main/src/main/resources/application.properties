spring.application.name=No Dues Portal
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlite:data/no-dues.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.file-storage-path=data/uploads
# Set these only during the first secure local setup. Admin is never public-registerable.
app.admin.email=${NO_DUES_ADMIN_EMAIL:}
app.admin.password=${NO_DUES_ADMIN_PASSWORD:}
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:no-reply@localhost}
app.portal.base-url=${APP_PORTAL_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.google.enabled=${APP_GOOGLE_ENABLED:false}
spring.profiles.active=${APP_GOOGLE_ENABLED:false}
